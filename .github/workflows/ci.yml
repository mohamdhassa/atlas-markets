name: ATLAS MARKETS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_markets
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_markets
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Build production-equivalent test image
        run: docker build --tag atlas-markets:ci .
      - name: Validate clean database migrations
        run: |
          docker run --rm --network host -e DATABASE_URL atlas-markets:ci alembic upgrade head
          docker run --rm --network host -e DATABASE_URL atlas-markets:ci alembic current
      - name: Run full application and bridge suite
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e TEST_DATABASE_URL -e REDIS_URL -e TEST_REDIS_URL \
            -v "$PWD/tools:/app/tools:ro" \
            atlas-markets:ci python -m pytest -o addopts='' -q -rs
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_markets
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_markets"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

name: ATLAS MARKETS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned container, migrations, full suite and app smoke
        run: bash ops/validate_release_candidate.sh "$(git rev-parse HEAD)"

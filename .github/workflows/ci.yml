name: ATLAS MARKETS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: pip install -e .
      - name: Run test suite
        env:
          DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_markets
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_markets
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_markets"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

name: ATLAS MARKETS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production-compatible test image
        run: docker build --tag atlas-markets-ci .
      - name: Run complete test suite
        run: >-
          docker run --rm
          --network host
          -e DATABASE_URL=postgresql+psycopg://atlas:atlas@127.0.0.1:5432/atlas_markets
          -e REDIS_URL=redis://127.0.0.1:6379/0
          atlas-markets-ci
          python -m pytest -q
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_markets
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_markets"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
